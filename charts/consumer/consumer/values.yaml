Values Consumer
replicaCount: 1

image:
  repository: 925310216015.dkr.ecr.eu-north-1.amazonaws.com/yalinreop-test:consumer-latest
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9422   # metrics

env:
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: user
  RABBITMQ_PASSWORD: CHANGEME
  RABBITMQ_QUEUE: demo-queue